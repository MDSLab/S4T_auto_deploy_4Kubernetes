# Strimzi 4.x richiede KafkaNodePool separato dal cluster Kafka.
# ── Namespace ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
# ── KafkaNodePool ─────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: kafka
  labels:
    strimzi.io/cluster: airwatch-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 5Gi
    deleteClaim: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
---
# ── Kafka Cluster ─────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: airwatch-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    metadataVersion: "4.1-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          bootstrap:
            nodePort: 30616
          brokers:
            - broker: 0
              nodePort: 30617
              advertisedHost: <CLOUD_IP>
              advertisedPort: 30616
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# ── Kafka Topic ───────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: airwatch-normalized
  namespace: kafka
  labels:
    strimzi.io/cluster: airwatch-kafka
spec:
  partitions: 4
  replicas: 1
  config:
    retention.ms: 3600000
    segment.bytes: 10485760
