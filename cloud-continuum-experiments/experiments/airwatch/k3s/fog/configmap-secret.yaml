apiVersion: v1
kind: ConfigMap
metadata:
  name: airwatch-config
  namespace: airwatch
data:
  # Soglie fog — modificabili senza re-deploy
  THR_PM25: "25.0"
  THR_PM10: "50.0"
  THR_TEMP: "45.0"
  THR_HUM:  "90.0"
  THR_CO:   "10.0"
  THR_NO2:  "0.1"
  # Pipeline
  AGG_WINDOW:        "60"
  DEDUP_WINDOW:      "60"
  EDGE_POLL_INTERVAL: "5.0"
  MAX_RETRIES:       "3"
  RETRY_BACKOFF:     "2.0"
  HTTP_TIMEOUT:      "5.0"
  # Porte
  S1_PORT: "8001"
  S2_PORT: "8002"
  S3_PORT: "8003"
  S4_PORT: "8004"
  S5_PORT: "8005"
  # Namespace
  PIPELINE_NS: "airwatch"
  REMOTE_NS:   "airwatch-remote"
  # Kafka
  KAFKA_BOOTSTRAP: "<CLOUD_IP>:30616"
  KAFKA_TOPIC:     "airwatch-normalized"
  # InfluxDB
  INFLUX_HOST: "<DATABASE_IP>"
  INFLUX_DB:   "airwatch"
  INFLUX_PORT: "30086"
---
apiVersion: v1
kind: Secret
metadata:
  name: airwatch-secrets
  namespace: airwatch
type: Opaque
stringData:
  # WARNING: do not commit with actual values.
  # In production usare Sealed Secrets o Vault.
  INFLUX_USER:     "admin"
  INFLUX_PASSWORD: "admin"
