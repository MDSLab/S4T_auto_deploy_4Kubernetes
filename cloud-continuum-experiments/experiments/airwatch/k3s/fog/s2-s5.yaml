# ── s2 — normalizzazione ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2
  namespace: airwatch
  labels:
    app: s2
    component: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s2
  template:
    metadata:
      labels:
        app: s2
        component: pipeline
    spec:
      containers:
        - name: s2
          image: mariorossi851234/pipeline:v1.2.0
          imagePullPolicy: Always
          args: ["python", "s2_normalize.py"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: airwatch-config
            - secretRef:
                name: airwatch-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: s2
  namespace: airwatch
spec:
  selector:
    app: s2
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
---
