apiVersion: apps/v1
kind: Deployment
metadata:
  name: s1
  namespace: airwatch
  labels:
    app: s1
    component: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s1
  template:
    metadata:
      labels:
        app: s1
        component: pipeline
    spec:
      containers:
        - name: s1
          image: mariorossi851234/pipeline:v1.2.1-s1-latency
          imagePullPolicy: Always
          args: ["python", "s1_ingest.py"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: airwatch-config
            - secretRef:
                name: airwatch-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: s1
  namespace: airwatch
spec:
  selector:
    app: s1
  type: NodePort
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 32001
