apiVersion: v1
kind: ConfigMap
metadata:
  name: airwatch-remote-config
  namespace: airwatch-remote
data:
  R2_PORT:     "8010"
  PIPELINE_NS: "airwatch"
  REMOTE_NS:   "airwatch-remote"
---
apiVersion: v1
kind: Secret
metadata:
  name: airwatch-remote-secrets
  namespace: airwatch-remote
type: Opaque
stringData:
  # Credentials for external notification channels (stub)
  WEBHOOK_URL:    "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  SMTP_HOST:      "smtp.example.com"
  SMTP_USER:      "alerts@example.com"
  SMTP_PASSWORD:  "changeme"
  TWILIO_SID:     "YOUR_TWILIO_SID"
  TWILIO_TOKEN:   "YOUR_TWILIO_TOKEN"
