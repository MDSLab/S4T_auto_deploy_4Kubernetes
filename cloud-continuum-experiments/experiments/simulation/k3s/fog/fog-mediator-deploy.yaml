apiVersion: apps/v1
kind: Deployment
metadata:
  name: eprem
  namespace: simulation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eprem
  template:
    metadata:
      labels:
        app: eprem
    spec:
      containers:
      - name: eprem
        image: __MICROSERVICES_IMAGE__
        imagePullPolicy: Always
        command: ["python", "fog/eprem.py"]
        env:
        - name: KAFKA_BOOTSTRAP
          value: "<CLOUD_IP>:32341" # NodePort per Kafka se necessario
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: eprem
  namespace: simulation
spec:
  type: NodePort
  selector:
    app: eprem
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 31003
