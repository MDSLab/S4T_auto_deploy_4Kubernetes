apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: simulation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: simulation
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: simulation
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: simulation
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
